<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Daftar Tamu Factory</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-links">
            <a href="login.html" class="nav-link">Admin</a>
            <a href="display.html" class="nav-link">Display</a>
        </div>
        <button class="nav-hamburger" onclick="this.parentElement.classList.toggle('active')">
            &#9776;
        </button>
    </nav>

    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>🏭 Factory</h1>
                <p>Visitor Management System</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                
                <button type="submit" class="btn">Login</button>
                
                <div id="errorMessage" class="error-message">
                    Username atau password salah!
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Check if already logged in
        if (isLoggedIn()) {
            window.location.href = 'admin.html';
        }

        // Handle login form
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            if (login(username, password)) {
                window.location.href = 'admin.html';
            } else {
                errorMessage.style.display = 'block';
                
                // Shake animation
                const loginBox = document.querySelector('.login-box');
                loginBox.style.animation = 'shake 0.5s ease-in-out';
                setTimeout(() => {
                    loginBox.style.animation = '';
                }, 500);
            }
        });

        // Focus on username field
        document.getElementById('username').focus();
    </script>

    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</body>
</html>
