<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Daftar Tamu Factory</title>
    <link rel="icon" href="img/GGF.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-links">
            <a href="login.html" class="nav-link active">Admin</a>
            <a href="display.html" class="nav-link">Display</a>
        </div>
        <button class="nav-hamburger" onclick="this.parentElement.classList.toggle('active')">
            &#9776;
        </button>
    </nav>

    <div class="admin-container">
        <!-- Header -->
        <header class="admin-header">
            <h1>🏭 Daftar Tamu Factory</h1>
            <div class="nav-links">
                <a href="display.html" target="_blank">📺 Display Board</a>
                <a href="#" onclick="exportToJSON()">📥 Export JSON</a>
                <a href="#" onclick="document.getElementById('importFile').click()">📤 Import JSON</a>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(this)">
                <a href="#" onclick="logout()">🚪 Logout</a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="admin-content">
            <!-- Guest Form -->
            <div class="guest-form-container">
                <h2>➕ Tambah Tamu Baru</h2>
                <form id="guestForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nama">Nama Tamu</label>
                            <input 
                                type="text" 
                                id="nama" 
                                name="nama" 
                                placeholder="Nama lengkap tamu"
                                required
                            >
                        </div>
                        
                        <div class="form-group">
                            <label for="tanggal">Tanggal Kunjungan</label>
                            <input 
                                type="text" 
                                id="tanggal" 
                                name="tanggal" 
                                placeholder="Pilih tanggal"
                                readonly
                                required
                            >
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="perusahaan">Asal Perusahaan</label>
                            <input 
                                type="text" 
                                id="perusahaan" 
                                name="perusahaan" 
                                placeholder="Nama perusahaan"
                                required
                            >
                        </div>
                        
                        <div class="form-group">
                            <label for="keperluan">Keperluan</label>
                            <input 
                                type="text" 
                                id="keperluan" 
                                name="keperluan" 
                                placeholder="Tujuan kunjungan"
                                required
                            >
                        </div>
                    </div>
                    
                    <button type="submit" class="btn">Tambah Tamu</button>
                </form>
            </div>

            <!-- Guest Table -->
            <div class="guest-table-container">
                <div class="guest-table-header">
                    <h2>📋 Daftar Tamu</h2>
                    <span class="guest-count" id="guestCount">0 tamu</span>
                </div>
                
                <div class="table-controls">
                    <div class="per-page-container">
                        <label for="perPageSelect">Tampilkan:</label>
                        <select id="perPageSelect" onchange="changeItemsPerPage(this.value)">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="All">Semua</option>
                        </select>
                    </div>
                    <div class="search-container">
                        <span class="search-icon">🔍</span>
                        <input 
                            type="text" 
                            id="searchInput" 
                            class="search-input" 
                            placeholder="Ketik untuk mencari..."
                            oninput="debouncedSearch(this.value)"
                        >
                    </div>
                </div>
                
                <div id="loadingContainer" class="loading-container" style="display:none;">
                    <div class="loading-spinner"></div>
                </div>
                
                <table class="guest-table">
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Tanggal</th>
                            <th>Perusahaan</th>
                            <th>Keperluan</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="guestTableBody">
                        <!-- Guest rows will be inserted here -->
                    </tbody>
                </table>
                
                <div id="emptyState" class="empty-state hidden">
                    <p>Belum ada tamu</p>
                    <button class="btn" onclick="document.getElementById('nama').focus()">Tambah Tamu Baru</button>
                </div>
                
                <div id="noResultsState" class="empty-state hidden">
                    <p id="noResultsText"></p>
                </div>
                
                <div id="paginationContainer" class="pagination-container hidden">
                    <div class="pagination-info" id="paginationInfo"></div>
                    <div class="pagination-controls">
                        <button class="btn btn-small" id="prevBtn" onclick="changePage(guestListState.currentPage - 1)">&lt; Sebelumnya</button>
                        <div class="page-numbers" id="pageNumbers"></div>
                        <button class="btn btn-small" id="nextBtn" onclick="changePage(guestListState.currentPage + 1)">Berikutnya &gt;</button>
                    </div>
                </div>
            </div>
            
            <!-- Delete Confirmation Modal -->
            <div id="deleteModal" class="modal-overlay" style="display:none;">
                <div class="modal-container">
                    <div class="modal-header">
                        <h3>Apakah Anda Yakin?</h3>
                    </div>
                    <div class="modal-body">
                        <p class="modal-guest-name"></p>
                        <p class="modal-guest-company"></p>
                        <p class="modal-guest-date"></p>
                        <p class="modal-warning">Data yang dihapus tidak dapat dikembalikan.</p>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="closeModal()">Tidak</button>
                        <button class="btn btn-danger" onclick="confirmDelete()">Ya</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Check authentication
        if (!checkAuth()) {
            window.location.href = 'login.html';
        }

        // Initialize Flatpickr date picker
        flatpickr('#tanggal', {
            dateFormat: 'Y-m-d',
            defaultDate: 'today',
            minDate: 'today',
            locale: 'id'
        });

        // Debounced search function
        const debouncedSearch = debounce(function(query) {
            guestListState.searchQuery = query;
            guestListState.currentPage = 1;
            renderGuestList();
        }, 300);

        // Load and display guests
        function loadGuests() {
            cleanPastGuests();
            showLoading();
            
            // Small delay to show loading state
            setTimeout(() => {
                renderGuestList();
                hideLoading();
            }, 100);
        }

        // Handle form submission
        document.getElementById('guestForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const guestData = {
                nama: document.getElementById('nama').value.trim(),
                tanggal: document.getElementById('tanggal').value,
                perusahaan: document.getElementById('perusahaan').value.trim(),
                keperluan: document.getElementById('keperluan').value.trim()
            };
            
            // Validate
            if (!guestData.nama || !guestData.tanggal || !guestData.perusahaan || !guestData.keperluan) {
                alert('Semua field harus diisi!');
                return;
            }
            
            // Add guest
            addGuest(guestData);
            
            // Reset form
            this.reset();
            // Re-initialize Flatpickr to reset to today
            flatpickr('#tanggal', {
                dateFormat: 'Y-m-d',
                defaultDate: 'today',
                minDate: 'today',
                locale: 'id'
            });
            
            // Reload table
            loadGuests();
            
            // Show success feedback
            showNotification('Tamu berhasil ditambahkan!');
        });

        // Status changes are handled by changeStatus() in app.js
        // which is called from status buttons in createGuestRow()

        // Delete guest - now uses confirmation modal
        function removeGuest(id) {
            showDeleteConfirmation(id);
        }

        // Handle JSON import
        function handleImport(input) {
            const file = input.files[0];
            if (!file) return;
            
            importFromJSON(file)
                .then(count => {
                    showNotification(`${count} tamu baru berhasil diimport`);
                    loadGuests();
                })
                .catch(err => {
                    alert('Gagal import: ' + err.message);
                });
            
            // Reset input
            input.value = '';
        }

        // Show notification
        function showNotification(message) {
            // Create notification element
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: var(--primary-color);
                color: #ffffff;
                padding: 12px 24px;
                border-radius: 4px;
                font-family: var(--font-mono);
                font-size: 14px;
                font-weight: bold;
                z-index: 1000;
                animation: slideIn 0.3s ease-out;
            `;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            // Remove after 3 seconds
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease-in';
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 3000);
        }

        // Initial load
        loadGuests();
    </script>

    <style>
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
    </style>
</body>
</html>
