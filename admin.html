<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Daftar Tamu Factory</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-links">
            <a href="login.html" class="nav-link active">Admin</a>
            <a href="display.html" class="nav-link">Display</a>
        </div>
        <button class="nav-hamburger" onclick="this.parentElement.classList.toggle('active')">
            &#9776;
        </button>
    </nav>

    <div class="admin-container">
        <!-- Header -->
        <header class="admin-header">
            <h1>🏭 Daftar Tamu Factory</h1>
            <div class="nav-links">
                <a href="display.html" target="_blank">📺 Display Board</a>
                <a href="#" onclick="exportToJSON()">📥 Export JSON</a>
                <a href="#" onclick="document.getElementById('importFile').click()">📤 Import JSON</a>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(this)">
                <a href="#" onclick="logout()">🚪 Logout</a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="admin-content">
            <!-- Guest Form -->
            <div class="guest-form-container">
                <h2>➕ Tambah Tamu Baru</h2>
                <form id="guestForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nama">Nama Tamu</label>
                            <input 
                                type="text" 
                                id="nama" 
                                name="nama" 
                                placeholder="Nama lengkap tamu"
                                required
                            >
                        </div>
                        
                        <div class="form-group">
                            <label for="tanggal">Tanggal Kunjungan</label>
                            <input 
                                type="text" 
                                id="tanggal" 
                                name="tanggal" 
                                placeholder="Pilih tanggal"
                                readonly
                                required
                            >
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="perusahaan">Asal Perusahaan</label>
                            <input 
                                type="text" 
                                id="perusahaan" 
                                name="perusahaan" 
                                placeholder="Nama perusahaan"
                                required
                            >
                        </div>
                        
                        <div class="form-group">
                            <label for="keperluan">Keperluan</label>
                            <input 
                                type="text" 
                                id="keperluan" 
                                name="keperluan" 
                                placeholder="Tujuan kunjungan"
                                required
                            >
                        </div>
                    </div>
                    
                    <button type="submit" class="btn">Tambah Tamu</button>
                </form>
            </div>

            <!-- Guest Table -->
            <div class="guest-table-container">
                <div class="guest-table-header">
                    <h2>📋 Daftar Tamu</h2>
                    <span class="guest-count" id="guestCount">0 tamu</span>
                </div>
                
                <table class="guest-table">
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Tanggal</th>
                            <th>Perusahaan</th>
                            <th>Keperluan</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="guestTableBody">
                        <!-- Guest rows will be inserted here -->
                    </tbody>
                </table>
                
                <div id="emptyState" class="empty-state hidden">
                    <p>Belum ada data tamu</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Check authentication
        if (!checkAuth()) {
            window.location.href = 'login.html';
        }

        // Initialize Flatpickr date picker
        flatpickr('#tanggal', {
            dateFormat: 'Y-m-d',
            defaultDate: 'today',
            minDate: 'today',
            locale: 'id'
        });

        // Load and display guests
        function loadGuests() {
            cleanPastGuests();
            const guests = getGuests();
            const tbody = document.getElementById('guestTableBody');
            const emptyState = document.getElementById('emptyState');
            const guestCount = document.getElementById('guestCount');
            
            // Clear table
            tbody.innerHTML = '';
            
            if (guests.length === 0) {
                emptyState.classList.remove('hidden');
                guestCount.textContent = '0 tamu';
            } else {
                emptyState.classList.add('hidden');
                guestCount.textContent = `${guests.length} tamu`;
                
                guests.forEach(guest => {
                    const row = createGuestRow(guest, true);
                    tbody.appendChild(row);
                });
            }
        }

        // Handle form submission
        document.getElementById('guestForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const guestData = {
                nama: document.getElementById('nama').value.trim(),
                tanggal: document.getElementById('tanggal').value,
                perusahaan: document.getElementById('perusahaan').value.trim(),
                keperluan: document.getElementById('keperluan').value.trim()
            };
            
            // Validate
            if (!guestData.nama || !guestData.tanggal || !guestData.perusahaan || !guestData.keperluan) {
                alert('Semua field harus diisi!');
                return;
            }
            
            // Add guest
            addGuest(guestData);
            
            // Reset form
            this.reset();
            // Re-initialize Flatpickr to reset to today
            flatpickr('#tanggal', {
                dateFormat: 'Y-m-d',
                defaultDate: 'today',
                minDate: 'today',
                locale: 'id'
            });
            
            // Reload table
            loadGuests();
            
            // Show success feedback
            showNotification('Tamu berhasil ditambahkan!');
        });

        // Status changes are handled by changeStatus() in app.js
        // which is called from status buttons in createGuestRow()

        // Delete guest
        function removeGuest(id) {
            if (confirm('Yakin ingin menghapus tamu ini?')) {
                deleteGuest(id);
                loadGuests();
                showNotification('Tamu berhasil dihapus');
            }
        }

        // Handle JSON import
        function handleImport(input) {
            const file = input.files[0];
            if (!file) return;
            
            importFromJSON(file)
                .then(count => {
                    showNotification(`${count} tamu baru berhasil diimport`);
                    loadGuests();
                })
                .catch(err => {
                    alert('Gagal import: ' + err.message);
                });
            
            // Reset input
            input.value = '';
        }

        // Show notification
        function showNotification(message) {
            // Create notification element
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: var(--primary-color);
                color: #ffffff;
                padding: 12px 24px;
                border-radius: 4px;
                font-family: var(--font-mono);
                font-size: 14px;
                font-weight: bold;
                z-index: 1000;
                animation: slideIn 0.3s ease-out;
            `;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            // Remove after 3 seconds
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease-in';
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 3000);
        }

        // Initial load
        loadGuests();
    </script>

    <style>
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
    </style>
</body>
</html>
